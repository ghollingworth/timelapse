# Apache Virtual Host Configuration for Timelapse Controller
# This file should be placed in /etc/apache2/sites-available/

<VirtualHost *:80>
    ServerName localhost
    ServerAlias timelapse.local
    
    DocumentRoot /opt/timelapse/static
    
    # WSGI Configuration
    WSGIDaemonProcess timelapse user=timelapse group=timelapse threads=5 python-path=/opt/timelapse
    WSGIProcessGroup timelapse
    WSGIScriptAlias / /opt/timelapse/timelapse.wsgi
    
    # Static files served directly by Apache (better performance)
    Alias /static /opt/timelapse/static
    <Directory /opt/timelapse/static>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Media files (images and videos) - served from data directory
    Alias /media/images /var/lib/timelapse/images
    Alias /media/videos /var/lib/timelapse/videos
    
    <Directory /var/lib/timelapse/images>
        Require all granted
    </Directory>
    
    <Directory /var/lib/timelapse/videos>
        Require all granted
    </Directory>
    
    # WSGI application directory
    <Directory /opt/timelapse>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Security headers
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection "1; mode=block"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/timelapse_error.log
    CustomLog ${APACHE_LOG_DIR}/timelapse_access.log combined
</VirtualHost>
